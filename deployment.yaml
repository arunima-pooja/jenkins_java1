apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-hello-world
spec:
  replicas: 1
  selector:
    matchLabels:
      app: java-app
  template:
    metadata:
      labels:
        app: java-app
    spec:
      containers:
      - name: java-container
        image: arunima10pooja/java-hello-world:14
        ports:
        - containerPort: 8080
        # This hack keeps the container running even if the Java app exits
        command: ["/bin/sh", "-c"]
        args: ["java -jar app.jar || true; tail -f /dev/null"]
---
apiVersion: v1
kind: Service
metadata:
  name: java-app-service
spec:
  selector:
    app: java-app
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: NodePort
